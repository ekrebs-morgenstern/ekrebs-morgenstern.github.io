name: Deployment

on:
  push:
    branches:
      - main

  # Allow manual execution from the Actions tab
  workflow_dispatch:

  # cron: minutes, hour, day of the month, month, day of the week  (UTC)
  # every day at 6:00 UTC
  #schedule:
  #  - cron: "0 6 * * *" 

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
          persist-credentials: true

      - name: Update submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --remote --chekout

      # Add your site build steps here.
      # For Jekyll, for example:
      # - uses: ruby/setup-ruby@v1
      #   with:
      #     bundler-cache: true
      # - run: bundle exec jekyll build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # - name: Verify Pages directory
      #   run: |
      #     test -d "docs/mon CV"
      #     find "docs/mon CV" -maxdepth 2 -type f | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "docs/mon CV"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
